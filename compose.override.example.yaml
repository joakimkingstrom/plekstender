# Example for running behind a Traefik instance you already have, on an external
# Docker network (here called "proxy"). Copy to compose.override.yaml and adjust;
# Docker Compose merges it automatically. In .env, set:
#   TRAEFIK_ENABLE=true
#   PLEKSTENDER_HOST=plekstender.example.com
#   TRAEFIK_ENTRYPOINT=websecure            # your entrypoint name
#   TRAEFIK_CERTRESOLVER=myresolver         # your cert resolver name
#   FORWARDED_ALLOW_IPS=*
#   APP_URL=https://plekstender.example.com
services:
  frontend:
    ports: !reset []
    networks:
      - db
      - default
      - proxy
    labels:
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true

# Optional: let Plekstender save artist.jpg into your artist folders (and, later, edit tags).
# Mount the music folder read-write into the worker only (here at /music): the web app
# never touches music files. Then in Settings -> Artwork set "Music folder as Plex sees
# it" and "Same folder in Plekstender's container" (/music).
#
# services:
#   worker:
#     volumes:
#       - data:/data
#       - /mnt/media/music:/music
