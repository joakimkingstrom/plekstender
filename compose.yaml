name: plekstender

# Shared settings for the services that run the Plekstender image.
x-plekstender: &plekstender
  # Built from this checkout on `docker compose up` by default. To use the published
  # image instead, set PLEKSTENDER_IMAGE=ghcr.io/joakimkingstrom/plekstender:latest and
  # PLEKSTENDER_PULL_POLICY=always in .env.
  image: ${PLEKSTENDER_IMAGE:-plekstender:local}
  build: .
  pull_policy: ${PLEKSTENDER_PULL_POLICY:-build}
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    TZ: ${TZ:-UTC}
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    # Downloaded fonts, uploads, artwork exports.
    - data:/data
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plekstender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plekstender}
    volumes:
      - db:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Applies database migrations, then exits. The app services wait for it.
  db-init:
    <<: *plekstender
    command: ["plekstender", "migrate"]
    restart: "no"
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy

  # Web app: serves the API under /api and the frontend for everything else.
  frontend:
    <<: *plekstender
    command: ["plekstender", "web"]
    # Published on every interface by default; behind a reverse proxy on this host, set
    # PLEKSTENDER_LISTEN=127.0.0.1:8080 so only the proxy can reach it.
    ports:
      - "${PLEKSTENDER_LISTEN:-${PLEKSTENDER_PORT:-8080}}:8080"
    networks:
      - db
      - default
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "plekstender", "healthcheck", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-false}"
      - "traefik.http.routers.plekstender.rule=Host(`${PLEKSTENDER_HOST:-plekstender.localhost}`)"
      - "traefik.http.routers.plekstender.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.plekstender.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.plekstender.loadbalancer.server.port=8080"

  # Background jobs (library sync, bulk artwork, playlist refreshes...).
  worker:
    <<: *plekstender
    command: ["plekstender", "worker"]
    networks:
      - db
      - default
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "plekstender", "healthcheck", "worker"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Optional image search for artist logos: `docker compose --profile search up -d`.
  # Not published on any port; only Plekstender can reach it.
  searxng:
    image: searxng/searxng:2026.11.21-c6ee3e9fd
    profiles: ["search"]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env to use the search profile}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  # Optional reverse proxy with Let's Encrypt, for setups without one:
  # `docker compose --profile traefik up -d` (and set PLEKSTENDER_HOST, TRAEFIK_ACME_EMAIL).
  # It only serves Plekstender, so it's told the route in a file (traefik-routes, below)
  # instead of being given the Docker socket to discover containers.
  # Already run Traefik? See compose.override.example.yaml instead.
  traefik:
    image: traefik:v3.7.19
    profiles: ["traefik"]
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/routes.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: traefik-routes
        target: /etc/traefik/routes.yml
    volumes:
      - letsencrypt:/letsencrypt
    networks:
      - default
    security_opt:
      - no-new-privileges:true

configs:
  # The bundled Traefik's one route: PLEKSTENDER_HOST to the web app, over https.
  traefik-routes:
    content: |
      http:
        routers:
          plekstender:
            rule: Host(`${PLEKSTENDER_HOST:-plekstender.localhost}`)
            entryPoints: [websecure]
            service: plekstender
            tls:
              certResolver: letsencrypt
        services:
          plekstender:
            loadBalancer:
              servers:
                - url: http://frontend:8080

networks:
  # Database traffic only; no internet access.
  db:
    internal: true
  default:

volumes:
  db:
  data:
  letsencrypt:
