# SearXNG configuration for RoadieFM's artist-logo image search.
# The instance is only reachable from inside the compose network, so the rate limiter
# and public-instance features are off. The secret comes from SEARXNG_SECRET.
use_default_settings:
  engines:
    keep_only:
      - google images
      - bing images
      - duckduckgo images
      - qwant images
      # "qwant images" reuses this engine's network settings (`network: qwant`), so it
      # must be kept or SearXNG crashes on start with KeyError: 'qwant'. It stays
      # disabled (its default), so it never runs a search.
      - qwant

# qwant images is disabled in SearXNG's defaults; turn it on. google images stays
# disabled: Google blocks most server IPs ("access denied"), so it only adds failed
# requests. Set `disabled: false` if it works from your network.
engines:
  - name: google images
    disabled: true
  - name: qwant images
    disabled: false

general:
  instance_name: "RoadieFM search"
  enable_metrics: false

server:
  secret_key: "set-via-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

valkey:
  url: false
