# Used for local development (`uv run alembic revision --autogenerate -m "..."`).
# In containers, migrations run via `plekstender migrate`, which configures Alembic in code.
[alembic]
script_location = plekstender:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
