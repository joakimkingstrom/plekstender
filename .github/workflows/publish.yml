name: Publish image

# After CI passes on main (or for a version tag), build the image for amd64 and arm64
# and push it to GitHub Container Registry: ghcr.io/<owner>/plekstender.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The commit being built: the one CI tested (workflow_run), or the tagged one. Worked
      # out here because metadata-action's own sha is the latest commit on main, and its git
      # context can't read a detached checkout.
      - id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/plekstender
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Plekstender
            org.opencontainers.image.description=Self-hosted helper app for Plex and Plexamp music libraries
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
