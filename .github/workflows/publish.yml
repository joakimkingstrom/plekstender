name: Publish image

# After CI passes on main, build the image for amd64 and arm64 and push it to GitHub
# Container Registry: ghcr.io/<owner>/plekstender, tagged latest, with its version (0.1.212)
# and with its commit (sha-1a2b3c4). Releases (release.yml) name one of these builds.
#
# After CI passes on a push to staging: the same, tagged staging and staging-1a2b3c4 (never
# latest, a version or sha-…, which releases look for), its version marked as a staging
# build (0.1.212-staging), for trying changes before they go into main.
#
# GitHub runs this file as it is on main, whichever branch's CI finished.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: read
  packages: write

# One build at a time per branch (github.ref is always main here: use the branch CI ran on).
concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  image:
    # Pushes only: CI also runs for pull requests, whose branch may be called staging too.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
          # All of history: the version's last number counts the commits.
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The commit being built: the one CI tested. Worked out here because metadata-action's
      # own sha is the latest commit on main, and its git context can't read a detached checkout.
      - id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      # The version (see .github/scripts/version.sh): 0.1.<number of commits>, plus
      # "-staging" for staging builds (staging's count runs ahead of main's).
      - id: version
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          version=$(.github/scripts/version.sh)
          if [ "$BRANCH" = staging ]; then version="$version-staging"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Plekstender $version from $BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/plekstender
          # main: latest, the version and sha-<commit>; staging: staging and staging-<commit>.
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }},enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=staging,enable=${{ github.event.workflow_run.head_branch == 'staging' }}
            type=raw,value=staging-${{ steps.commit.outputs.short }},enable=${{ github.event.workflow_run.head_branch == 'staging' }}
          labels: |
            org.opencontainers.image.title=Plekstender
            org.opencontainers.image.description=Self-hosted helper app for Plex and Plexamp music libraries
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLEKSTENDER_VERSION=${{ steps.version.outputs.version }}
            PLEKSTENDER_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
